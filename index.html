<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku Master</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h1>Sudoku Game</h1>

    <div class="difficulty">
      <button onclick="startGame('easy')">Easy</button>
      <button onclick="startGame('medium')">Medium</button>
      <button onclick="startGame('hard')">Hard</button>
      <button onclick="startGame('expert')">Expert</button>
    </div>

    <div id="status">
      Lives: <span id="lives-count">3</span>/3 Score:
      <span id="score-count">0</span>
    </div>

    <div id="sudoku-game"></div>

    <div class="controls">
      <div class="number-buttons">
        <button class="number-btn" data-number="1">1</button>
        <button class="number-btn" data-number="2">2</button>
        <button class="number-btn" data-number="3">3</button>
        <button class="number-btn" data-number="4">4</button>
        <button class="number-btn" data-number="5">5</button>
        <button class="number-btn" data-number="6">6</button>
        <button class="number-btn" data-number="7">7</button>
        <button class="number-btn" data-number="8">8</button>
        <button class="number-btn" data-number="9">9</button>
      </div>

      <div class="button-actions">
        <div class="action-item" id="restart">
          <div class="icon">↺</div>
           <span>Restart</span>
        </div>

        <div class="action-item" id="mark-small">
          <div class="icon">✎</div>
             <span>Notes</span>
        </div>

        <div class="action-item" id="clear">
          <div class="icon">⌫</div>
            <span>Clear</span>
      </div>

        <div class="action-item" id="undo">
          <div class="icon">↶</div>
            <span>Undo</span>
       </div>
      </div>

    <div id="Game-over-screen" class="hidden">
             <h2>Game Over</h2>
          <p>You ran out of lives!</p>
      <div class="game-over-buttons">
        <button id="restart-btn" onclick="resetGame()">Play Again</button>
        <button id="new-game-btn" onclick="startGame()">New Game</button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
