<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <title>Sudoku Master</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="main-menu" class="overlay-screen">
        <h1 class="logo-text">SUDOKU</h1>
      <button id="play-button" class="main-play-btn">PLAY</button>
    </div>

    <div id="difficulty-menu" class="bottom-sheet hidden">
      <div class="sheet-overlay" id="sheet-close-zone"></div>
      <div class="sheet-content">
        <div class="drag-handle"></div>
        <h2 class="sheet-title">Select Difficulty</h2>
     <div class="difficulty-list">   
      <button class="difficulty-btn" data-level="Easy">Easy</button>
      <button class="difficulty-btn selected" data-level="Medium">Medium</button>
      <button class="difficulty-btn" data-level="Hard">Hard</button>
      <button class="difficulty-btn" data-level="Advanced">Advanced</button>
      <button class="difficulty-btn" data-level="Impossible">Impossible</button>
    </div>
      </div>
    </div>

  <div id="game-container" class="hidden">
   <div id="status">
     <div class="stat-box">
       <span class="label">LIVES</span>
       <span class="value"><span id="lives-count">3</span>/3</span>
     </div>
  
     <div class="stat-box">
      <span class="label">SCORE</span>
        <span id="score-count" class="value">0</span>
     </div>

     <div class="stat-box">
       <span class="label">TIME</span>
       <span id="time-count" class="value">0:00</span>
      </div>
   </div>

    <div id="sudoku-game"></div>

    <div class="controls">
      <div class="number-buttons">
        <button class="number-btn" data-number="1">1
          <span class="count-badge">9</span></button>
        <button class="number-btn" data-number="2">2
          <span class="count-badge">9</span></button>
        <button class="number-btn" data-number="3">3
          <span class="count-badge">9</span></button>
        <button class="number-btn" data-number="4">4
          <span class="count-badge">9</span></button>
        <button class="number-btn" data-number="5">5
          <span class="count-badge">9</span></button>
        <button class="number-btn" data-number="6">6
          <span class="count-badge">9</span></button>
        <button class="number-btn" data-number="7">7
          <span class="count-badge">9</span></button>
        <button class="number-btn" data-number="8">8
          <span class="count-badge">9</span></button>
        <button class="number-btn" data-number="9">9
          <span class="count-badge">9</span></button>
      </div>

      <div class="button-actions">
        <div class="action-item" id="home-button" onclick="showDifficultyMenu()">
          <div class="icon">🏠</div>
            <span>Home</span>
        </div>

        <div class="action-item" id="restart">
          <div class="icon">↺</div>
           <span>Restart</span>
        </div>

        <div class="action-item" id="mark-small">
          <div class="icon">✎</div>
             <span>Notes</span>
        </div>

        <div class="action-item" id="clear">
          <div class="icon">⌫</div>
            <span>Clear</span>
      </div>

        <div class="action-item" id="undo">
          <div class="icon">↶</div>
            <span>Undo</span>
       </div>
      </div>
      </div>

    <div id="Game-over-screen" class="hidden">
             <h2>Game Over</h2>
          <p>You ran out of lives!</p>
      <div class="game-over-buttons">
        <button id="restart-btn" onclick="resetGame()">Play Again</button>
        <button id="new-game-btn" onclick="showDifficultyMenu()">New Game</button>
      </div>
    </div>

    <div id="win-screen" class="hidden">
      <div class="winner-content">
        <h2>Victory!</h2>
          <p>You completed the puzzle!</p>

      <div class="final-stats-container">
        <div class="final-stat">
          <span class="stat-label"> LIVES</span>
            <span id="final-lives">3</span>/3</span>
        </div>
        <div class="final-stat">
         <span class="stat-label">TIME</span>
          <span id="final-time">00:00</span>
       </div>
        <div class="final-stat">
         <span class="stat-label">SCORE</span>
         <span id="final-score">0</span>
       </div>
    </div>

    <div class="winner-actions-container">
       <div class="winner-buttons">
        <button class="win-btn primary" onclick="resetGame()">Play Again</button>
        <button  id="win-new-game-btn" class="win-btn secondary" onclick="showDifficultyMenu()">New Game</button>
      </div>
    </div> 
   </div>
   </div>
    

    <script src="index.js"></script>
  </body>
</html>
